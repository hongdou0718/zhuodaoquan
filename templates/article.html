<div class="reading-progress" aria-hidden="true">
  <span id="reading-progress-bar"></span>
</div>

<article class="article-shell">
  <header class="article-header">
    <a class="back-link" href="../index.html#archive">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="m15 18-6-6 6-6"></path>
      </svg>
      返回文章列表
    </a>
    <div class="article-meta">
      <time datetime="{{date_iso}}">{{date_display}}</time>
      <span>{{tag}}</span>
      <span>约 {{reading_minutes}} 分钟</span>
    </div>
    <h1>{{title}}</h1>
    <p class="article-summary">{{summary}}</p>
  </header>

  <div class="article-body">
    {{article_body}}
  </div>

  <footer class="article-footer">
    <div class="article-footer__top">
      <span class="end-mark" aria-hidden="true"></span>
      <button class="copy-button" type="button" data-copy-link>
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <rect width="14" height="14" x="8" y="8" rx="2" ry="2"></rect>
          <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"></path>
        </svg>
        <span>复制链接</span>
      </button>
    </div>
    <p class="article-tag">收录于 <span>{{tag}}</span></p>
  </footer>
</article>

<nav class="post-navigation" aria-label="相邻文章">
  {{post_navigation}}
</nav>
