<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{page_title}}</title>
  <meta name="description" content="{{description}}">
  <meta name="theme-color" content="#f2f3ee">
  <meta property="og:locale" content="zh_CN">
  <meta property="og:type" content="{{og_type}}">
  <meta property="og:title" content="{{og_title}}">
  <meta property="og:description" content="{{description}}">
  {{meta_extra}}
  <link rel="icon" href="{{root}}assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="{{root}}assets/style.css">
  <link rel="alternate" type="application/rss+xml" title="{{site_title}} RSS" href="{{root}}feed.xml">
  <script>
    (function () {
      var saved = localStorage.getItem("paper-theme");
      var preferred = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.dataset.theme = saved || preferred;
    })();
  </script>
</head>
<body class="{{body_class}}">
  <a class="skip-link" href="#main">跳到正文</a>
  <header class="site-header">
    <div class="site-header__inner">
      <a class="brand" href="{{root}}index.html" aria-label="{{site_title}}首页">
        <span class="brand__mark" aria-hidden="true">纸</span>
        <span class="brand__name">{{site_title}}</span>
      </a>
      <nav class="site-nav" aria-label="主导航">
        {{nav}}
      </nav>
      <div class="header-actions">
        <a class="rss-link" href="{{root}}feed.xml">RSS</a>
        <button class="icon-button theme-toggle" type="button" aria-label="切换明暗主题" title="切换明暗主题">
          <svg class="icon theme-toggle__sun" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.66 6.34l1.41-1.41"></path>
          </svg>
          <svg class="icon theme-toggle__moon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main id="main">
    {{content}}
  </main>

  <footer class="site-footer">
    <div class="site-footer__inner">
      <p>© {{year}} {{author}}</p>
      <p>写于日常，留在纸间。</p>
    </div>
  </footer>

  <script src="{{root}}assets/site.js" defer></script>
</body>
</html>
